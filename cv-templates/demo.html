<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidator — CV Templates Demo (15 ta shablon)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="cv-templates.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: #27272a;
      --brand: #f97316;
      --text: #fafafa;
      --muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    header.top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1.logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--brand);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      background: rgba(249, 115, 22, 0.15);
      color: var(--brand);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    .tabs {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tab {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--brand);
      color: #fff;
    }
    .tab .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .card:hover {
      border-color: rgba(249, 115, 22, 0.5);
      transform: translateY(-2px);
    }
    .card.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2);
    }
    .card-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-id {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .preview-section {
      background: #27272a;
      border-radius: 20px;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
    }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <header class="top">
      <div>
        <h1 class="logo">CANDIDATOR <span class="badge">15 ta Shablon</span></h1>
        <p style="color:var(--muted); font-size:13px; margin-top:4px;">
          Har bir bo'limda 5 tadan shablon: Modern, Classic, Minimal
        </p>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="window.print()">🖨️ PDF yuklab olish / Print</button>
      </div>
    </header>

    <div style="margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;">
      <div class="tabs" id="categoryTabs"></div>
      <span id="currentSelection" style="font-size:12px; color:var(--muted); font-weight:600;"></span>
    </div>

    <div class="templates-grid" id="templatesGrid"></div>

    <div class="preview-section">
      <div id="cv"></div>
    </div>
  </div>

  <script>
    const SAMPLE = {
      fullName: "Alisher Qodirov",
      position: "Senior Frontend Muhandis",
      photo: "",
      email: "alisher.qodirov@example.com",
      phone: "+998 90 123 45 67",
      address: "Toshkent, O'zbekiston",
      website: "https://candidator.uz",
      github: "alisher-dev",
      linkedin: "alisher-qodirov",
      telegram: "alisher_dev",
      summary: "5 yildan ortiq tajribaga ega dasturchi. React, Next.js va TypeScript texnologiyalari yordamida yuqori yuklanishga bardosh beruvchi veb-ilovalarni yaratish bo'yicha mutaxassis.",
      experience: [
        {
          position: "Lead Frontend Developer",
          company: "FinTech Soliq Tech",
          location: "Toshkent",
          start: "2022",
          end: "Hozirgacha",
          description: "- Micro-frontend arxitekturasini joriy etish\n- Sahifalar yuklanish tezligini 40% ga optimallashtirish\n- 8 kishilik frontend jamoasiga mentorlik qilish"
        },
        {
          position: "Frontend Developer",
          company: "IT Park Incubator",
          location: "Nukus",
          start: "2020",
          end: "2022",
          description: "- 10 dan ortiq startap loyihalarining veb qismini noldan yaratish\n- REST API va GraphQL integratsiyasi"
        }
      ],
      education: [
        {
          degree: "Bakalavr - Kompyuter Ilmlari",
          school: "TATU Nukus filiali",
          start: "2016",
          end: "2020",
          description: "Dasturiy ta'minot injiniringi yo'nalishi"
        }
      ],
      skills: [
        { name: "TypeScript", level: 95 },
        { name: "React / Next.js", level: 95 },
        { name: "Tailwind CSS", level: 90 },
        { name: "Redux / Zustand", level: 85 },
        { name: "Git & CI/CD", level: 80 },
        { name: "Docker", level: 75 }
      ],
      languages: [
        { name: "O'zbek tili", level: "Ona tili" },
        { name: "Qaraqalpaq tili", level: "Erkin" },
        { name: "Ingliz tili", level: "B2 - Upper-Intermediate" },
        { name: "Rus tili", level: "C1 - Advanced" }
      ],
      projects: [
        {
          name: "Candidator AI Platform",
          link: "candidator.vercel.app",
          year: "2024",
          description: "Talabalar va ish beruvchilar uchun aqlli CV yaratish va vakansiyalarga avtomatik saralash platformasi."
        }
      ],
      certificates: [
        { name: "Meta Frontend Developer Professional Certificate", issuer: "Coursera", year: "2023" }
      ],
      hobbies: ["Shaxmat", "Ochiq kodli loyihalar", "Kitobxonlik"]
    };

    let currentCategory = 'modern';
    let currentTemplate = 'modern-1';

    function renderTabs() {
      const tabsEl = document.getElementById('categoryTabs');
      tabsEl.innerHTML = CVTemplates.categories.map(cat => `
        <button class="tab ${cat.id === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat.id}')">
          <span class="dot" style="background:${cat.color}"></span>
          ${cat.name} (5)
        </button>
      `).join('');
    }

    function renderCards() {
      const grid = document.getElementById('templatesGrid');
      const list = CVTemplates.list(currentCategory);
      grid.innerHTML = list.map(item => `
        <div class="card ${item.id === currentTemplate ? 'active' : ''}" onclick="selectTemplate('${item.id}')">
          <div class="card-name">${item.name}</div>
          <div class="card-id">${item.id}</div>
        </div>
      `).join('');

      document.getElementById('currentSelection').textContent =
        `Tanlangan: ${currentTemplate.toUpperCase()}`;
    }

    function updatePreview() {
      document.getElementById('cv').innerHTML = CVTemplates.render(currentTemplate, SAMPLE);
    }

    function selectCategory(cat) {
      currentCategory = cat;
      currentTemplate = cat + '-1';
      renderTabs();
      renderCards();
      updatePreview();
    }

    function selectTemplate(tplId) {
      currentTemplate = tplId;
      renderCards();
      updatePreview();
    }

    // Init
    renderTabs();
    renderCards();
    updatePreview();
  </script>
</body>
</html>
